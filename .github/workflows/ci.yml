name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck

  lint:
    name: lint (oxlint + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

  test:
    name: test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm test
        run: pnpm test

  cargo-test:
    name: cargo test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Purge pre-installed Homebrew rust shims (macOS arm runner image fix)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euxo pipefail
          # Newer macos-15-arm64 images ship /opt/homebrew/bin/cargo as a
          # rustup-init-derived binary that does not act as a rustup proxy,
          # which makes `cargo test` fail with "Usage: rustup-init[EXE]".
          # Remove the shims so actions-rust-lang/setup-rust-toolchain takes
          # the fresh-install branch and installs proper proxies into
          # ~/.cargo/bin, prepending it to $GITHUB_PATH.
          for bin in cargo cargo-fmt cargo-clippy rustc rustup rustdoc; do
            sudo rm -f "/opt/homebrew/bin/${bin}" "/usr/local/bin/${bin}" || true
          done

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Do NOT restore ~/.cargo/bin from cache: a prior run on the broken
          # macos-15-arm64 image cached a rustup-init-derived `cargo` binary
          # that overwrites the fresh proxy installed by setup-rust-toolchain.
          # We don't `cargo install` anything in CI, so we lose nothing.
          cache-bin: false
          # Bump prefix-key to invalidate the existing poisoned caches.
          prefix-key: v1-rust

      - name: Verify cargo is the rustup proxy (fail-fast diagnostic)
        shell: bash
        run: |
          set -euxo pipefail
          which cargo
          which rustc
          cargo --version
          rustc --version
          rustup show
          # `rustup-init` masquerading as cargo prints "Usage: rustup-init"
          # rather than "cargo X.Y.Z". This catches both the image-rollout
          # flake and any future regression from rust-cache restoration.
          cargo --version | grep -E '^cargo ' \
            || { echo "::error::cargo is not the rustup proxy"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (required for tauri::generate_context!)
        run: pnpm build

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
