name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the draft release (e.g. v0.0.0-dev)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  release:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Purge pre-installed Homebrew rust shims (macOS arm runner image fix)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euxo pipefail
          # See ci.yml: newer macos-15-arm64 images ship a broken
          # /opt/homebrew/bin/cargo that breaks tauri-action's `cargo build`
          # with "Usage: rustup-init[EXE]". Remove the shims so rustup
          # installs fresh proxies into ~/.cargo/bin.
          for bin in cargo cargo-fmt cargo-clippy rustc rustup rustdoc; do
            sudo rm -f "/opt/homebrew/bin/${bin}" "/usr/local/bin/${bin}" || true
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # See ci.yml: do not restore ~/.cargo/bin (poisoned cargo proxy
          # from a prior broken-image run will overwrite the fresh one).
          cache-bin: false
          prefix-key: v1-rust

      - name: Verify cargo is the rustup proxy (fail-fast diagnostic)
        shell: bash
        run: |
          set -euxo pipefail
          which cargo
          cargo --version | grep -E '^cargo ' \
            || { echo "::error::cargo is not the rustup proxy"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "QuotaHUD ${{ steps.tag.outputs.name }}"
          # The maintainer-publish gate stays; once a maintainer publishes the
          # draft, GitHub's `releases/latest` endpoint surfaces it to the Tauri
          # updater. Drafts AND prereleases are filtered from `latest`, so
          # `prerelease: false` is required for auto-updates to roll out.
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Alpha build of QuotaHUD. macOS binaries are ad-hoc signed; Windows is unsigned.

            - macOS: ad-hoc signed but not notarized, so Gatekeeper still asks on first launch (the "is damaged … move it to the Trash" error should be gone). Right-click the `.app` → "Open" (on macOS 15, then allow it under System Settings → Privacy & Security → Open Anyway), or run `xattr -dr com.apple.quarantine /Applications/QuotaHUD.app` after copying it.
            - Windows: the installer is not code-signed. SmartScreen will warn — choose "More info" → "Run anyway" if you trust the build.
            - Linux: the `.AppImage` may need `chmod +x` before launching. `.deb` is provided as well.

            Developer ID signing and notarization are tracked as future work — see the README "Roadmap / Future work" section. Auto-updates via Tauri updater are enabled in this build; see the README "Updates" section for details.
          args: ${{ matrix.args }}
