name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the draft release (e.g. v0.0.0-dev)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  release:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: 'QuotaHUD ${{ steps.tag.outputs.name }}'
          releaseDraft: true
          prerelease: true
          releaseBody: |
            Unsigned alpha build of QuotaHUD.

            - macOS: the app is not notarized. Right-click the `.app` → "Open" the first time, or run `xattr -dr com.apple.quarantine /Applications/QuotaHUD.app` after copying it. The `.dmg` is also unsigned.
            - Windows: the installer is not code-signed. SmartScreen will warn — choose "More info" → "Run anyway" if you trust the build.
            - Linux: the `.AppImage` may need `chmod +x` before launching. `.deb` is provided as well.

            Signing, notarization, and the Tauri updater are tracked as future work — see the README "Roadmap / Future work" section.
          args: ${{ matrix.args }}
