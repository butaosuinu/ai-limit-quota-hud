[package]
name = "quotahud"
version = "0.0.0"
description = "QuotaHUD — AI quota overlay"
edition = "2021"
rust-version = "1.77"

[lib]
name = "quotahud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# enables Tauri's custom protocol used in production builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
